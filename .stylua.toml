# 语法兼容性：支持所有 Lua 语法变体
syntax = "All"

# 行宽限制：120 字符适合现代宽屏显示器，兼顾单行信息量与可读性
column_width = 120

# 换行符：显式固定为 Unix(LF)。注意 StyLua 不会按操作系统自动切换：
# 不写这一项时，它用的就是自身默认值 Unix(LF)，在 Windows 上同样是 LF。
# （此前这里写成"自动适应当前操作系统"是不准确的，导致 CRLF 文件被漏检。）
# 可选值：Unix (LF) / Windows (CRLF)。保持 LF 可避免保存时整份文件被重排。
line_endings = "Unix"

# 缩进配置：使用 空格，保证不同编辑器打开时排版绝对一致
indent_type = "Spaces"
indent_width = 2

# 字符串引号：自动选择，优先使用双引号（视觉上更柔和，符合多数主流语言习惯）
quote_style = "AutoPreferDouble"

# 函数调用括号：始终保留括号，避免在链式调用时产生歧义
call_parentheses = "Always"

# 简单语句折叠：永不折叠（如将 if 和 return 写在同一行），保持逻辑块视觉上的独立
collapse_simple_statement = "Never"

# require 语句排序：禁用自动排序，避免破坏开发者有意为之的分组逻辑
[sort_requires]
enabled = false
